name: Reusable CI Gates

on:
  workflow_call:
    inputs:
      run_quality:
        required: false
        type: boolean
        default: true
      run_security:
        required: false
        type: boolean
        default: true
      run_sonar:
        description: "SonarQube scan + quality gate (disable for deploy pipeline if rules block releases)"
        required: false
        type: boolean
        default: true

jobs:
  quality:
    if: ${{ inputs.run_quality }}
    name: Quality gates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test:ci
      - name: Build check
        run: npm run build

  security:
    if: ${{ inputs.run_security }}
    name: Security gates
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check SonarCloud configuration
        if: ${{ inputs.run_sonar }}
        env:
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          if [ -z "$SONAR_ORGANIZATION" ] || [ -z "$SONAR_PROJECT_KEY" ]; then
            echo "::error::Set GitHub repository Variables SONAR_ORGANIZATION and SONAR_PROJECT_KEY (see SonarCloud: Your project → Information → project key and organization key)."
            exit 1
          fi
      - name: SonarQube Scan
        if: ${{ inputs.run_sonar }}
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
      - name: SonarQube Quality Gate
        if: ${{ inputs.run_sonar }}
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Snyk dependency scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --severity-threshold=high
      - name: Build image for Snyk container scan
        run: docker build -t app:security-scan .
      - name: Snyk container scan
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: app:security-scan
          args: --severity-threshold=high
