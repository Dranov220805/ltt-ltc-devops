name: Application CI/CD (EKS + Helm Blue-Green)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional immutable image tag (default: short SHA)"
        required: false
        default: ""
      stabilization_minutes:
        description: "Bake time after blue deployment before green"
        required: false
        default: "20"
      deployment_strategy:
        description: "Deployment strategy: bluegreen or canary"
        required: false
        default: "bluegreen"
      cluster_wave_size:
        description: "How many clusters to update per wave"
        required: false
        default: "1"

permissions:
  id-token: write
  contents: read

concurrency:
  group: app-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
  # AWS_ROLE_TO_ASSUME must be the IAM role ARN: arn:aws:iam::ACCOUNT_ID:role/ROLE_NAME
  # Put OIDC trust conditions (token.actions.githubusercontent.com:sub, repo:...) in IAM only — not in this variable.
  # Defaults match this repo’s Helm chart (helm/app, release api → Deployment api-app).
  # Use workflow env only (don’t reference env.* inside job-level env — it resolves empty).
  HELM_CHART_PATH: ${{ vars.HELM_CHART_PATH || 'helm/app' }}
  HELM_RELEASE_NAME: ${{ vars.HELM_RELEASE_NAME || 'api' }}
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'default' }}
  K8S_DEPLOYMENT_NAME: ${{ vars.K8S_DEPLOYMENT_NAME || 'api-app' }}
  HELM_VALUES_FILE: ${{ vars.HELM_VALUES_FILE != '' && vars.HELM_VALUES_FILE || 'helm/app/values.deploy.yaml' }}
  # uploads PVC class used by chart value uploadsPersistence.storageClass.
  # Default efs-sc — provisioned by Terraform (modules/efs + aws-efs-csi-driver addon)
  # so multiple replicas can share the same volume (ReadWriteMany). Override to gp2/gp3
  # only when running a single replica without the EFS stack.
  UPLOADS_STORAGE_CLASS: ${{ vars.UPLOADS_STORAGE_CLASS || 'efs-sc' }}
  APP_INGRESS_HOST: ${{ vars.APP_INGRESS_HOST || 'www.devops-ltc.io.vn' }}
  ALB_CERTIFICATE_ARN: ${{ vars.ALB_CERTIFICATE_ARN || '' }}
  # Optional: SYNC_K8S_RUNTIME_SECRET=true creates/updates runtime Secret before Helm.
  # For in-cluster data services, APP_MONGO_URI / APP_REDIS_URL may be omitted (workflow derives cluster DNS).
  HELM_INSTALL_TIMEOUT: ${{ vars.HELM_INSTALL_TIMEOUT || '20m' }}
  # Must match an existing ECR repository in your account (create in AWS if missing).
  # GitHub Variables treat whitespace-only values as truthy for || ; normalization happens in validate-aws / compute artifact metadata.
  ECR_REPOSITORY_NAME: ${{ vars.ECR_REPOSITORY_NAME != '' && vars.ECR_REPOSITORY_NAME || 'devops-final-app' }}
  # EKS blue targets: vars.EKS_BLUE_CLUSTERS (comma-separated) or vars.EKS_CLUSTER_NAME; deploy-blue resolves with default devops-final-dev-eks (Terraform locals: "${project}-${environment}-eks").

jobs:
  ci-gates:
    uses: ./.github/workflows/reusable-ci.yml
    with:
      # Deploy pipeline: skip Sonar (free tier / strict quality gate); PR CI still runs Sonar via nodejs.yml / build.yml
      run_sonar: false
    secrets: inherit

  helm-validate:
    name: Helm lint and template validation
    runs-on: ubuntu-latest
    needs: ci-gates
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - name: Helm lint
        run: helm lint "${HELM_CHART_PATH}"
      - name: Helm template render
        run: helm template "${HELM_RELEASE_NAME}" "${HELM_CHART_PATH}" --namespace "${K8S_NAMESPACE}" > rendered-manifests.yaml
      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manifests
          path: rendered-manifests.yaml

  validate-aws:
    name: Validate AWS deploy configuration
    runs-on: ubuntu-latest
    needs: helm-validate
    steps:
      - name: Ensure AWS_ROLE_TO_ASSUME is an IAM role ARN
        env:
          ROLE: ${{ vars.AWS_ROLE_TO_ASSUME }}
        run: |
          set -euo pipefail
          if [[ -z "${ROLE// /}" ]]; then
            echo "::error::Repository variable AWS_ROLE_TO_ASSUME is empty. Set it to arn:aws:iam::ACCOUNT_ID:role/ROLE_NAME"
            exit 1
          fi
          if [[ ! "${ROLE}" =~ ^arn:aws:iam::[0-9]{12}:role/ ]]; then
            echo "::error::AWS_ROLE_TO_ASSUME must be the full IAM role ARN, e.g. arn:aws:iam::123456789012:role/GitHubOIDCDeploy"
            echo "Do not paste trust-policy lines like token.actions.githubusercontent.com or repo:ORG/REPO — those belong in the role trust policy in AWS IAM."
            echo "Received (truncated): ${ROLE:0:120}"
            exit 1
          fi
      - name: Resolve ECR repository name for Docker tags
        env:
          REPO_RAW: ${{ vars.ECR_REPOSITORY_NAME }}
          REPO_WORKFLOW: ${{ env.ECR_REPOSITORY_NAME }}
        run: |
          set -euo pipefail
          trim() { printf '%s' "${1:-}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          REPO="$(trim "${REPO_RAW:-}")"
          if [[ -z "$REPO" ]]; then REPO="$(trim "${REPO_WORKFLOW:-}")"; fi
          if [[ -z "$REPO" ]]; then REPO="devops-final-app"; fi
          echo "Effective ECR_REPOSITORY_NAME for images: ${REPO}"

  build-and-push:
    name: Build and push artifact
    runs-on: ubuntu-latest
    needs: validate-aws
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_repo: ${{ steps.meta.outputs.image_repo }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
      - name: Install dependencies and validate build
        run: |
          npm ci
          npm run build
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Compute artifact metadata
        id: meta
        shell: bash
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO_RAW: ${{ vars.ECR_REPOSITORY_NAME }}
          REPO_WORKFLOW: ${{ env.ECR_REPOSITORY_NAME }}
        run: |
          set -euo pipefail
          trim() { printf '%s' "${1:-}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          REGISTRY="${REGISTRY%/}"
          REPO="$(trim "${REPO_RAW:-}")"
          if [[ -z "$REPO" ]]; then REPO="$(trim "${REPO_WORKFLOW:-}")"; fi
          if [[ -z "$REPO" ]]; then REPO="devops-final-app"; fi
          if [[ -z "${REGISTRY:-}" ]]; then
            echo "::error::Amazon ECR login did not produce a registry URI (steps.ecr.outputs.registry). Multi-registry login leaves registry unset — use a single registry or set inputs on aws-actions/amazon-ecr-login@v2."
            exit 1
          fi
          CUSTOM_TAG="${{ github.event.inputs.image_tag }}"
          SHA_TAG="${GITHUB_SHA::12}"
          TAG="${CUSTOM_TAG:-$SHA_TAG}"
          IMAGE_REPO="${REGISTRY}/${REPO}"
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image_repo=${IMAGE_REPO}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_REPO}:${TAG}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_repo }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish artifact summary
        run: |
          {
            echo "## Build Artifact"
            echo "- Image: ${{ steps.meta.outputs.image }}"
            echo "- Immutable tag: ${{ steps.meta.outputs.image_tag }}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-blue:
    name: Deploy blue cluster set
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      IMG_REPO: ${{ needs.build-and-push.outputs.image_repo }}
      IMG_TAG: ${{ needs.build-and-push.outputs.image_tag }}
      RELEASE: ${{ vars.HELM_RELEASE_NAME || 'api' }}
      CHART: ${{ vars.HELM_CHART_PATH || 'helm/app' }}
      NS: ${{ vars.K8S_NAMESPACE || 'default' }}
      VALUES_FILE: ${{ vars.HELM_VALUES_FILE != '' && vars.HELM_VALUES_FILE || 'helm/app/values.deploy.yaml' }}
      HELM_TIMEOUT: ${{ vars.HELM_INSTALL_TIMEOUT || '20m' }}
      DEPLOYMENT_STRATEGY: ${{ github.event.inputs.deployment_strategy || 'bluegreen' }}
      CLUSTER_WAVE_SIZE: ${{ github.event.inputs.cluster_wave_size || '1' }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve blue cluster list
        shell: bash
        env:
          BLUE_RAW: ${{ vars.EKS_BLUE_CLUSTERS }}
          CLUSTER_SINGLE: ${{ vars.EKS_CLUSTER_NAME }}
        run: |
          set -euo pipefail
          trim() { printf '%s' "${1:-}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          BLUE="$(trim "${BLUE_RAW:-}")"
          if [[ -z "$BLUE" ]]; then BLUE="$(trim "${CLUSTER_SINGLE:-}")"; fi
          if [[ -z "$BLUE" ]]; then BLUE="devops-final-dev-eks"; fi
          echo "BLUE_CLUSTERS=${BLUE}" >> "$GITHUB_ENV"
          echo "Resolved BLUE_CLUSTERS=${BLUE}"
      - name: Validate required variables
        shell: bash
        run: |
          set -euo pipefail
          for V in RELEASE CHART NS BLUE_CLUSTERS; do
            if [ -z "${!V}" ]; then
              echo "Missing variable: ${V}" >&2
              exit 1
            fi
          done
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - name: Deploy image to blue clusters
        shell: bash
        env:
          SYNC_RUNTIME_SECRET: ${{ vars.SYNC_K8S_RUNTIME_SECRET }}
          RUNTIME_SECRET_NAME: ${{ vars.RUNTIME_SECRET_NAME || 'api-runtime-env' }}
          INCLUSTER_DATA_SERVICES: ${{ vars.INCLUSTER_DATA_SERVICES || 'true' }}
          K8S_MONGO_SERVICE_NAME: ${{ vars.K8S_MONGO_SERVICE_NAME || 'mongodb' }}
          K8S_REDIS_SERVICE_NAME: ${{ vars.K8S_REDIS_SERVICE_NAME || 'redis' }}
          K8S_MONGO_DB_NAME: ${{ vars.K8S_MONGO_DB_NAME || 'products_db' }}
          APP_MONGO_URI: ${{ secrets.APP_MONGO_URI }}
          APP_SESSION_SECRET: ${{ secrets.APP_SESSION_SECRET }}
          APP_REDIS_URL: ${{ secrets.APP_REDIS_URL }}
          APP_S3_BUCKET: ${{ secrets.APP_S3_BUCKET }}
          APP_AWS_REGION: ${{ secrets.APP_AWS_REGION }}
        run: |
          set -euo pipefail
          export AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-${AWS_REGION}}"
          verify_eks_kubectl_auth() {
            local cluster="$1"
            local caller iam_role_arn token endpoint
            caller="$(aws sts get-caller-identity --query Arn --output text)"
            iam_role_arn=""
            if [[ "${caller}" =~ ^arn:aws:sts::([0-9]+):assumed-role/([^/]+)/ ]]; then
              iam_role_arn="arn:aws:iam::${BASH_REMATCH[1]}:role/${BASH_REMATCH[2]}"
            fi
            echo "Kubernetes API auth check for cluster ${cluster} (STS ARN: ${caller})"
            echo "IAM role ARN used for EKS access entries: ${iam_role_arn:-cannot parse - expected assumed-role/ROLE/session}"
            export PATH="${PATH}:/usr/local/bin"
            which aws
            aws --version
            rm -rf "${HOME}/.kube"
            mkdir -p "${HOME}/.kube"
            export KUBECONFIG="${HOME}/.kube/config"
            export AWS_SDK_LOAD_CONFIG=1
            aws eks update-kubeconfig --name "${cluster}" --region "${AWS_REGION}"
            echo "===== KUBECONFIG (minified) ====="
            kubectl config view --minify
            echo "===== TOKEN TEST ====="
            aws eks get-token --cluster-name "${cluster}" --region "${AWS_REGION}" >/tmp/eks-token.json
            head -c 200 /tmp/eks-token.json || true
            echo
            if kubectl get ns --request-timeout=45s >/dev/null 2>&1; then
              echo "Kubernetes API authentication OK (cluster ${cluster})."
              return 0
            fi
            echo "--- describe-cluster accessConfig (must allow API access entries; not CONFIG_MAP-only) ---"
            aws eks describe-cluster --name "${cluster}" --region "${AWS_REGION}" --query 'cluster.accessConfig' --output json 2>&1 || true
            echo "--- VPC endpoint reachability (GitHub runners need public API or allowed CIDR) ---"
            aws eks describe-cluster --name "${cluster}" --region "${AWS_REGION}" --query 'cluster.resourcesVpcConfig.{endpointPublicAccess:endpointPublicAccess,publicAccessCidrs:publicAccessCidrs}' --output json 2>&1 || true
            if [[ -n "${iam_role_arn}" ]]; then
              echo "--- describe-access-entry (404 = no entry for this role; terraform apply module github_actions) ---"
              aws eks describe-access-entry --cluster-name "${cluster}" --principal-arn "${iam_role_arn}" 2>&1 || true
              echo "--- list-associated-access-policies (need AmazonEKSClusterAdminPolicy or equivalent) ---"
              aws eks list-associated-access-policies --cluster-name "${cluster}" --principal-arn "${iam_role_arn}" 2>&1 || true
            fi
            token="$(aws eks get-token --cluster-name "${cluster}" --region "${AWS_REGION}" --query 'status.token' --output text 2>/dev/null || true)"
            endpoint="$(aws eks describe-cluster --name "${cluster}" --region "${AWS_REGION}" --query 'cluster.endpoint' --output text 2>/dev/null || true)"
            if [[ -n "${token}" && -n "${endpoint}" ]]; then
              echo "--- direct API probe with bearer token ---"
              curl -k -H "Authorization: Bearer ${token}" "${endpoint}/api" || true
            fi
            echo "::error::Kubernetes API still rejects credentials for '${cluster}'. Apply terraform for aws_eks_access_entry + aws_eks_access_policy_association on role ${iam_role_arn:-UNKNOWN}. If cluster.authenticationMode is CONFIG_MAP only, update EKS to API_AND_CONFIG_MAP (see Terraform modules/eks access_config) then re-apply."
            kubectl get ns --request-timeout=45s || true
            exit 1
          }
          TMO="${HELM_TIMEOUT:-5m}"
          IFS=',' read -r -a CLUSTERS <<< "${BLUE_CLUSTERS}"
          WAVE_SIZE="${CLUSTER_WAVE_SIZE:-1}"
          if ! [[ "${WAVE_SIZE}" =~ ^[0-9]+$ ]] || [ "${WAVE_SIZE}" -lt 1 ]; then
            echo "Invalid cluster wave size: ${WAVE_SIZE}" >&2
            exit 1
          fi
          COUNTER=0
          for RAW in "${CLUSTERS[@]}"; do
            CLUSTER="$(echo "${RAW}" | xargs)"
            [ -z "${CLUSTER}" ] && continue
            COUNTER=$((COUNTER + 1))
            if [ $(((COUNTER - 1) % WAVE_SIZE)) -eq 0 ]; then
              echo "Starting wave $((((COUNTER - 1) / WAVE_SIZE) + 1))"
            fi
            echo "Deploying to blue cluster: ${CLUSTER}"
            verify_eks_kubectl_auth "${CLUSTER}"
            echo "Pre-Helm: $(kubectl config current-context)"
            aws sts get-caller-identity
            kubectl get ns --request-timeout=45s
            # shellcheck source=.github/scripts/sync-runtime-secret.sh
            source "${GITHUB_WORKSPACE}/.github/scripts/sync-runtime-secret.sh"
            sync_runtime_secret
            CMD=(helm upgrade --install "${RELEASE}" "${CHART}" --namespace "${NS}" --create-namespace --atomic --wait --timeout "${TMO}" --set-string image.repository="${IMG_REPO}" --set-string image.tag="${IMG_TAG}" --set-string rollout.mode="${DEPLOYMENT_STRATEGY}")
            CMD+=(--set-string uploadsPersistence.storageClass="${UPLOADS_STORAGE_CLASS}")
            CMD+=(--set-string ingress.hosts[0].host="${APP_INGRESS_HOST}")
            if [ -n "${ALB_CERTIFICATE_ARN}" ]; then
              CMD+=(--set-string ingress.annotations."alb\.ingress\.kubernetes\.io/certificate-arn"="${ALB_CERTIFICATE_ARN}")
            fi
            if [ "${DEPLOYMENT_STRATEGY}" = "canary" ]; then
              CMD+=(--set canary.enabled=true --set replicaCount=1 --set hpa.enabled=false --set-string rollout.strategy.maxSurge="100%" --set rollout.strategy.maxUnavailable=0)
            fi
            if [ -n "${VALUES_FILE}" ] && [ -f "${VALUES_FILE}" ]; then
              CMD+=(-f "${VALUES_FILE}")
            fi
            "${CMD[@]}"
            kubectl rollout status deployment/"${{ vars.K8S_DEPLOYMENT_NAME || 'api-app' }}" -n "${NS}" --timeout="${TMO}"
            kubectl get hpa -n "${NS}" -o wide || true
            kubectl -n "${NS}" port-forward svc/"${RELEASE}-app" 18080:80 >/tmp/port-forward.log 2>&1 &
            PF_PID=$!
            sleep 5
            curl -fsS "http://127.0.0.1:18080/health" >/dev/null
            curl -fsS "http://127.0.0.1:18080/ready" >/dev/null
            curl -fsS "http://127.0.0.1:18080/metrics" >/dev/null
            kill "${PF_PID}" || true
          done
      - name: Blue deployment summary
        run: |
          {
            echo "## Blue deployment"
            echo "- Clusters: ${{ env.BLUE_CLUSTERS }}"
            echo "- Image: ${IMG_REPO}:${IMG_TAG}"
          } >> "$GITHUB_STEP_SUMMARY"

  stabilize-blue:
    name: Stabilize blue before green
    needs: deploy-blue
    runs-on: ubuntu-latest
    steps:
      - name: Wait stabilization window
        shell: bash
        run: |
          set -euo pipefail
          M="${{ github.event.inputs.stabilization_minutes }}"
          if [ -z "${M}" ]; then
            M=5
          fi
          if [ "${M}" -gt 0 ]; then
            echo "Waiting ${M} minutes."
            sleep $((M * 60))
          fi

  deploy-green:
    name: Deploy green cluster set
    needs:
      - build-and-push
      - stabilize-blue
    if: ${{ vars.EKS_GREEN_CLUSTERS != '' }}
    runs-on: ubuntu-latest
    env:
      IMG_REPO: ${{ needs.build-and-push.outputs.image_repo }}
      IMG_TAG: ${{ needs.build-and-push.outputs.image_tag }}
      RELEASE: ${{ vars.HELM_RELEASE_NAME || 'api' }}
      CHART: ${{ vars.HELM_CHART_PATH || 'helm/app' }}
      NS: ${{ vars.K8S_NAMESPACE || 'default' }}
      VALUES_FILE: ${{ vars.HELM_VALUES_FILE != '' && vars.HELM_VALUES_FILE || 'helm/app/values.deploy.yaml' }}
      HELM_TIMEOUT: ${{ vars.HELM_INSTALL_TIMEOUT || '20m' }}
      GREEN_CLUSTERS: ${{ vars.EKS_GREEN_CLUSTERS }}
      DEPLOYMENT_STRATEGY: ${{ github.event.inputs.deployment_strategy || 'bluegreen' }}
      CLUSTER_WAVE_SIZE: ${{ github.event.inputs.cluster_wave_size || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - name: Deploy image to green clusters with rollback
        shell: bash
        env:
          SYNC_RUNTIME_SECRET: ${{ vars.SYNC_K8S_RUNTIME_SECRET }}
          RUNTIME_SECRET_NAME: ${{ vars.RUNTIME_SECRET_NAME || 'api-runtime-env' }}
          INCLUSTER_DATA_SERVICES: ${{ vars.INCLUSTER_DATA_SERVICES || 'true' }}
          K8S_MONGO_SERVICE_NAME: ${{ vars.K8S_MONGO_SERVICE_NAME || 'mongodb' }}
          K8S_REDIS_SERVICE_NAME: ${{ vars.K8S_REDIS_SERVICE_NAME || 'redis' }}
          K8S_MONGO_DB_NAME: ${{ vars.K8S_MONGO_DB_NAME || 'products_db' }}
          APP_MONGO_URI: ${{ secrets.APP_MONGO_URI }}
          APP_SESSION_SECRET: ${{ secrets.APP_SESSION_SECRET }}
          APP_REDIS_URL: ${{ secrets.APP_REDIS_URL }}
          APP_S3_BUCKET: ${{ secrets.APP_S3_BUCKET }}
          APP_AWS_REGION: ${{ secrets.APP_AWS_REGION }}
        run: |
          set -euo pipefail
          export AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-${AWS_REGION}}"
          verify_eks_kubectl_auth() {
            local cluster="$1"
            local caller iam_role_arn token endpoint
            caller="$(aws sts get-caller-identity --query Arn --output text)"
            iam_role_arn=""
            if [[ "${caller}" =~ ^arn:aws:sts::([0-9]+):assumed-role/([^/]+)/ ]]; then
              iam_role_arn="arn:aws:iam::${BASH_REMATCH[1]}:role/${BASH_REMATCH[2]}"
            fi
            echo "Kubernetes API auth check for cluster ${cluster} (STS ARN: ${caller})"
            echo "IAM role ARN used for EKS access entries: ${iam_role_arn:-cannot parse - expected assumed-role/ROLE/session}"
            export PATH="${PATH}:/usr/local/bin"
            which aws
            aws --version
            rm -rf "${HOME}/.kube"
            mkdir -p "${HOME}/.kube"
            export KUBECONFIG="${HOME}/.kube/config"
            export AWS_SDK_LOAD_CONFIG=1
            aws eks update-kubeconfig --name "${cluster}" --region "${AWS_REGION}"
            echo "===== KUBECONFIG (minified) ====="
            kubectl config view --minify
            echo "===== TOKEN TEST ====="
            aws eks get-token --cluster-name "${cluster}" --region "${AWS_REGION}" >/tmp/eks-token.json
            head -c 200 /tmp/eks-token.json || true
            echo
            if kubectl get ns --request-timeout=45s >/dev/null 2>&1; then
              echo "Kubernetes API authentication OK (cluster ${cluster})."
              return 0
            fi
            echo "--- describe-cluster accessConfig (must allow API access entries; not CONFIG_MAP-only) ---"
            aws eks describe-cluster --name "${cluster}" --region "${AWS_REGION}" --query 'cluster.accessConfig' --output json 2>&1 || true
            echo "--- VPC endpoint reachability (GitHub runners need public API or allowed CIDR) ---"
            aws eks describe-cluster --name "${cluster}" --region "${AWS_REGION}" --query 'cluster.resourcesVpcConfig.{endpointPublicAccess:endpointPublicAccess,publicAccessCidrs:publicAccessCidrs}' --output json 2>&1 || true
            if [[ -n "${iam_role_arn}" ]]; then
              echo "--- describe-access-entry (404 = no entry for this role; terraform apply module github_actions) ---"
              aws eks describe-access-entry --cluster-name "${cluster}" --principal-arn "${iam_role_arn}" 2>&1 || true
              echo "--- list-associated-access-policies (need AmazonEKSClusterAdminPolicy or equivalent) ---"
              aws eks list-associated-access-policies --cluster-name "${cluster}" --principal-arn "${iam_role_arn}" 2>&1 || true
            fi
            token="$(aws eks get-token --cluster-name "${cluster}" --region "${AWS_REGION}" --query 'status.token' --output text 2>/dev/null || true)"
            endpoint="$(aws eks describe-cluster --name "${cluster}" --region "${AWS_REGION}" --query 'cluster.endpoint' --output text 2>/dev/null || true)"
            if [[ -n "${token}" && -n "${endpoint}" ]]; then
              echo "--- direct API probe with bearer token ---"
              curl -k -H "Authorization: Bearer ${token}" "${endpoint}/api" || true
            fi
            echo "::error::Kubernetes API still rejects credentials for '${cluster}'. Apply terraform for aws_eks_access_entry + aws_eks_access_policy_association on role ${iam_role_arn:-UNKNOWN}. If cluster.authenticationMode is CONFIG_MAP only, update EKS to API_AND_CONFIG_MAP (see Terraform modules/eks access_config) then re-apply."
            kubectl get ns --request-timeout=45s || true
            exit 1
          }
          TMO="${HELM_TIMEOUT:-20m}"
          IFS=',' read -r -a CLUSTERS <<< "${GREEN_CLUSTERS}"
          WAVE_SIZE="${CLUSTER_WAVE_SIZE:-1}"
          if ! [[ "${WAVE_SIZE}" =~ ^[0-9]+$ ]] || [ "${WAVE_SIZE}" -lt 1 ]; then
            echo "Invalid cluster wave size: ${WAVE_SIZE}" >&2
            exit 1
          fi
          DEPLOYED=""
          COUNTER=0
          rollback() {
            IFS=',' read -r -a DONE <<< "${DEPLOYED}"
            for RAW in "${DONE[@]}"; do
              C="$(echo "${RAW}" | xargs)"
              [ -z "${C}" ] && continue
              echo "Rollback on green cluster: ${C}"
              export KUBECONFIG="${HOME}/.kube/config"
              aws eks update-kubeconfig --name "${C}" --region "${AWS_REGION}"
              helm rollback "${RELEASE}" -n "${NS}" --wait --timeout "${TMO}" || true
            done
          }
          trap rollback ERR
          for RAW in "${CLUSTERS[@]}"; do
            CLUSTER="$(echo "${RAW}" | xargs)"
            [ -z "${CLUSTER}" ] && continue
            COUNTER=$((COUNTER + 1))
            if [ $(((COUNTER - 1) % WAVE_SIZE)) -eq 0 ]; then
              echo "Starting wave $((((COUNTER - 1) / WAVE_SIZE) + 1))"
            fi
            echo "Deploying to green cluster: ${CLUSTER}"
            verify_eks_kubectl_auth "${CLUSTER}"
            echo "Pre-Helm: $(kubectl config current-context)"
            aws sts get-caller-identity
            kubectl get ns --request-timeout=45s
            # shellcheck source=.github/scripts/sync-runtime-secret.sh
            source "${GITHUB_WORKSPACE}/.github/scripts/sync-runtime-secret.sh"
            sync_runtime_secret
            CMD=(helm upgrade --install "${RELEASE}" "${CHART}" --namespace "${NS}" --create-namespace --atomic --wait --timeout "${TMO}" --set-string image.repository="${IMG_REPO}" --set-string image.tag="${IMG_TAG}" --set-string rollout.mode="${DEPLOYMENT_STRATEGY}")
            CMD+=(--set-string uploadsPersistence.storageClass="${UPLOADS_STORAGE_CLASS}")
            CMD+=(--set-string ingress.hosts[0].host="${APP_INGRESS_HOST}")
            if [ -n "${ALB_CERTIFICATE_ARN}" ]; then
              CMD+=(--set-string ingress.annotations."alb\.ingress\.kubernetes\.io/certificate-arn"="${ALB_CERTIFICATE_ARN}")
            fi
            if [ "${DEPLOYMENT_STRATEGY}" = "canary" ]; then
              CMD+=(--set canary.enabled=true --set replicaCount=1 --set hpa.enabled=false --set-string rollout.strategy.maxSurge="100%" --set rollout.strategy.maxUnavailable=0)
            fi
            if [ -n "${VALUES_FILE}" ] && [ -f "${VALUES_FILE}" ]; then
              CMD+=(-f "${VALUES_FILE}")
            fi
            "${CMD[@]}"
            kubectl rollout status deployment/"${{ vars.K8S_DEPLOYMENT_NAME || 'api-app' }}" -n "${NS}" --timeout="${TMO}"
            kubectl get hpa -n "${NS}" -o wide || true
            kubectl -n "${NS}" port-forward svc/"${RELEASE}-app" 18080:80 >/tmp/port-forward.log 2>&1 &
            PF_PID=$!
            sleep 5
            curl -fsS "http://127.0.0.1:18080/health" >/dev/null
            curl -fsS "http://127.0.0.1:18080/ready" >/dev/null
            curl -fsS "http://127.0.0.1:18080/metrics" >/dev/null
            kill "${PF_PID}" || true
            DEPLOYED="${DEPLOYED},${CLUSTER}"
          done
      - name: Green deployment summary
        run: |
          {
            echo "## Green deployment"
            echo "- Clusters: ${{ vars.EKS_GREEN_CLUSTERS }}"
            echo "- Image: ${IMG_REPO}:${IMG_TAG}"
            echo "- Rollback: automatic rollback executed on already-deployed green clusters when a failure occurs."
          } >> "$GITHUB_STEP_SUMMARY"

  observability-hooks:
    name: Deployment observability hooks
    # Do not need deploy-green: when EKS_GREEN_CLUSTERS is empty that job is skipped and
    # depending on it would skip this job (and confuse the graph) despite if: always().
    needs:
      - deploy-blue
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Deployment telemetry summary
        run: |
          {
            echo "## Observability Hooks"
            echo "- Blue result: ${{ needs.deploy-blue.result }}"
            echo "- Suggested metrics window: 24-48 hours after deployment"
            echo "- Track: CPU, memory, pod restarts, HPA desired/current replicas, request latency"
            echo "- Log source: CloudWatch or ELK ingestion status per cluster"
          } >> "$GITHUB_STEP_SUMMARY"
