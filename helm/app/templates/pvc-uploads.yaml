{{- if and .Values.uploadsPersistence.enabled (not .Values.uploadsPersistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.uploadsPersistence.claimName | default (printf "%s-uploads" (include "app.fullname" .)) }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.uploadsPersistence.accessMode | quote }}
  resources:
    requests:
      storage: {{ .Values.uploadsPersistence.size | quote }}
  {{- if .Values.uploadsPersistence.storageClass }}
  storageClassName: {{ .Values.uploadsPersistence.storageClass | quote }}
  {{- end }}
{{- end }}
