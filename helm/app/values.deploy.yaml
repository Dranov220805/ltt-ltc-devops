# =============================================================================
# Production overlay - reference from GitHub: HELM_VALUES_FILE=helm/app/values.deploy.yaml
# =============================================================================
# Before deploy:
#   1) Repo variable SYNC_K8S_RUNTIME_SECRET=true (CI applies Secret before helm upgrade).
#   2) GitHub Secrets: APP_SESSION_SECRET.
#      Optional overrides: APP_MONGO_URI, APP_REDIS_URL (otherwise CI derives in-cluster service DNS).
#      Leave APP_S3_BUCKET empty when using uploads PVC.
#      Optional: APP_AWS_REGION (else workflow AWS_REGION + extraEnv below set region).
#   3) Terraform: EKS Pod Identity binds IAM to the ServiceAccount below (no IRSA annotation).
#      terraform output app_uploads_pod_identity_role_arn (informational; association is in AWS).
#
# Secret api-runtime-env must exist in the target namespace (sync script creates it).
# Override name with repo variable RUNTIME_SECRET_NAME and change secretRef.name to match.
#
# --- Create Secret manually (PowerShell, namespace default) ---
# Fill placeholders from Terraform outputs / console. Mongo password must be URL-encoded in MONGO_URI.
# kubectl create secret generic api-runtime-env -n default `
#   --from-literal=MONGO_URI="mongodb://mongodb.default.svc.cluster.local:27017/products_db" `
#   --from-literal=SESSION_SECRET="YOUR_LONG_RANDOM_HEX" `
#   --from-literal=REDIS_URL="redis://redis.default.svc.cluster.local:6379" `
#   --from-literal=S3_BUCKET="" `
#   --from-literal=AWS_REGION="ap-southeast-1" `
#   --dry-run=client -o yaml | kubectl apply -f -
#
# Then from Final_Project: helm upgrade --install api ./helm/app -n default -f ./helm/app/values.deploy.yaml ...
# From sibling repo (e.g. ltt-ltc-terraform): use ../Final_Project/helm/app (forward slashes; backslashes break Helm on Windows).
# Or enable CI: SYNC_K8S_RUNTIME_SECRET=true + GitHub Secrets APP_* (see node_deployment.yml).
# =============================================================================

# Shared uploads volume across replicas. Provisioned by Terraform:
# modules/efs (filesystem + mount targets) + aws-efs-csi-driver addon + StorageClass efs-sc
# in modules/k8s-addons. Size is a nominal PVC field; EFS itself is elastic.
uploadsPersistence:
  enabled: true
  storageClass: efs-sc
  accessMode: ReadWriteMany
  size: 30Gi
  mountPath: /app/public/uploads

ingress:
  enabled: true
  className: alb
  # HTTP-only at ALB origin: Cloudflare proxy provides public TLS at the edge.
  # To enable origin HTTPS later, set alb.ingress.kubernetes.io/certificate-arn
  # via CI variable ALB_CERTIFICATE_ARN and switch listen-ports back to 80,443.
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    # Restrict app host edge entry points to Cloudflare IPv4 ranges.
    alb.ingress.kubernetes.io/inbound-cidrs: 173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22
  hosts:
    - host: www.devops-ltc.io.vn
      paths:
        - path: /
          pathType: Prefix

serviceMonitor:
  enabled: true
  namespace: monitoring
  interval: 15s
  scrapeTimeout: 10s
  path: /metrics
  labels:
    release: kube-prometheus-stack

envFrom:
  - secretRef:
      name: api-runtime-env

extraEnv:
  # Fail startup if DocumentDB is wrong (do not silently use in-memory data).
  - name: ALLOW_IN_MEMORY_FALLBACK
    value: "false"
  - name: SESSION_COOKIE_SECURE
    value: "true"
  # In-cluster Mongo/Redis startup tuning during rollout.
  - name: MONGO_SERVER_SELECTION_TIMEOUT_MS
    value: "45000"
  - name: MONGO_CONNECT_RETRIES
    value: "10"
  - name: MONGO_CONNECT_RETRY_DELAY_MS
    value: "4000"
  # Optional Redis tuning (override if needed)
  - name: REDIS_CONNECT_TIMEOUT_MS
    value: "15000"
  - name: REDIS_READY_TIMEOUT_MS
    value: "20000"

# Merge with base values.yaml - extend readiness window while Mongo connects.
probes:
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
  readiness:
    initialDelaySeconds: 15
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 24

# Node + mongoose retries: avoid OOM kills (exit 137) under cgroup limit.
resources:
  limits:
    cpu: "2"
    memory: 768Mi
  requests:
    cpu: 100m
    memory: 384Mi

# EKS Pod Identity (Terraform aws_eks_pod_identity_association): must match app_k8s_* in envs/dev.
serviceAccount:
  create: true
  name: api-app
  annotations: {}
