# Default image is overridden by CI (--set-string image.repository / image.tag).
replicaCount: 3

image:
  repository: changeme.example.com/app
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: ""
  annotations: {}

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: false
  className: alb
  annotations: {}
  hosts:
    - host: www.devops-ltc.io.vn
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 523Mi

rollout:
  strategy:
    type: RollingUpdate
    maxUnavailable: 0
    maxSurge: 1
  revisionHistoryLimit: 5
  mode: bluegreen

# HTTP probes - routes added in main.js (/health, /ready)
probes:
  liveness:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Horizontal Pod Autoscaler (metrics-server required on cluster)
hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 180
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60

# PodDisruptionBudget — keeps minAvailable pods Ready during voluntary disruption
# (node drain, rolling update). Set replicaCount/HPA so minAvailable + 1 pods can run.
pdb:
  enabled: true
  minAvailable: 2
  # maxUnavailable: 1   # mutually exclusive with minAvailable

# Spread replicas across nodes/zones so a single node failure removes at most one pod.
# labelSelector is auto-injected from chart selectorLabels.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway

env:
  - name: NODE_ENV
    value: "production"
  - name: PORT
    value: "3000"

# Extra env for production (prefer a separate values file + K8s Secrets):
# MONGO_URI, S3_BUCKET, AWS_REGION, REDIS_URL, SESSION_SECRET, DOCUMENTDB_TLS_CA_PATH,
# ALLOW_IN_MEMORY_FALLBACK=false, SESSION_COOKIE_SECURE=true — see .env.example.
extraEnv: []

# Optional: load every key from an existing Secret as container env (recommended for GitHub Actions:
# kubectl create secret generic ... --from-literal=MONGO_URI=... then set secretRef below).
# Explicit entries in env / extraEnv override duplicate keys from envFrom.
# envFrom:
#   - secretRef:
#       name: api-runtime-env
envFrom: []

serviceMonitor:
  enabled: false
  namespace: monitoring
  interval: 15s
  scrapeTimeout: 10s
  path: /metrics
  labels: {}

uploadsPersistence:
  enabled: false
  existingClaim: ""
  # When set (and existingClaim is empty), the chart creates a PVC with this exact name.
  # Use a new name when migrating storage class or accessMode; PVC spec is immutable after bind.
  claimName: ""
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 20Gi
  mountPath: /app/public/uploads

nodeSelector: {}
tolerations: []
affinity: {}

blueGreen:
  enabled: true
  blueClusters: ""
  greenClusters: ""

canary:
  enabled: false
  replicas: 1
  hpaEnabled: false
  maxUnavailable: 0
  maxSurge: "100%"
