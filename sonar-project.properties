# SonarQube / SonarCloud  project key and organization are set in CI via
# GitHub repository Variables: SONAR_ORGANIZATION, SONAR_PROJECT_KEY
# (Do not put secrets here.)

sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/coverage/**,**/.github/**,**/public/uploads/**,helm/**,performance/**,**/*.min.js
# Uncomment when you publish coverage: npm test with c8/nyc -> coverage/lcov.info
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
